<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>教室圖書借閱｜員林大同正興教室</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/zxing-wasm@3.1.4/dist/iife/reader/index.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
<style>
:root{
  --bg:#EDF1F0; --surface:#FFFFFF; --ink:#1E2B2F; --muted:#5C6A6D; --line:#D4DCDA;
  --primary:#1D5C63; --primary-dark:#154449; --primary-soft:#DCEAE9;
  --out:#8F5B0E; --out-soft:#FBEFD9;
  --late:#B3261E; --late-soft:#FBE2DF;
  --ok:#2E7447; --ok-soft:#E0F0E5;
  --serif:"Noto Serif TC","Songti TC",serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --tabbar:64px;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.55;
  -webkit-text-size-adjust:100%;padding-bottom:calc(var(--tabbar) + env(safe-area-inset-bottom,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid #6FA8AE;outline-offset:2px}
[hidden]{display:none!important}

/* 頁首 */
header.top{position:sticky;top:0;z-index:20;background:var(--primary);color:#fff;
  padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 10px;display:flex;align-items:center;gap:12px}
header.top h1{margin:0;font-family:var(--serif);font-size:20px;font-weight:700;letter-spacing:.04em;flex:1}
header.top .sub{display:block;font-family:var(--sans);font-size:12px;font-weight:400;opacity:.8;letter-spacing:0}
.conn{width:10px;height:10px;border-radius:50%;background:#E4A33B;flex:none}
.conn.on{background:#7FD69B}
.icon-btn{background:transparent;border:0;color:inherit;padding:6px;border-radius:8px;display:grid;place-items:center}
.icon-btn svg{width:24px;height:24px}

main{max-width:760px;margin:0 auto;padding:16px;padding-bottom:calc(var(--tabbar) + env(safe-area-inset-bottom,0px) + 32px)}
.tab-panel{display:none}
.tab-panel.active{display:block}

/* 底部分頁 */
nav.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabbar button{background:none;border:0;height:var(--tabbar);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  color:var(--muted);font-size:13px;position:relative}
nav.tabbar button svg{width:24px;height:24px}
nav.tabbar button.active{color:var(--primary);font-weight:700}
nav.tabbar .badge{position:absolute;top:8px;left:calc(50% + 6px);background:var(--late);color:#fff;font-size:11px;line-height:1;
  padding:3px 6px;border-radius:10px;font-weight:700}

/* 掃描主按鈕 */
.scan-hero{width:100%;border:0;border-radius:18px;background:var(--primary);color:#fff;padding:22px 20px;
  display:flex;align-items:center;gap:18px;text-align:left;box-shadow:0 6px 0 var(--primary-dark)}
.scan-hero:active{transform:translateY(3px);box-shadow:0 3px 0 var(--primary-dark)}
.scan-hero svg{width:64px;height:48px;flex:none}
.scan-hero strong{display:block;font-size:24px;font-family:var(--serif);letter-spacing:.06em}
.scan-hero span{font-size:14px;opacity:.85}
.quick-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}

.manual{display:flex;gap:8px;margin-top:14px}
.manual input{flex:1;min-width:0}

/* 統計 */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}
.stat{background:var(--surface);border-radius:12px;padding:12px;border:1px solid var(--line)}
.stat b{display:block;font-size:26px;line-height:1.2;font-variant-numeric:tabular-nums}
.stat small{color:var(--muted);font-size:13px}
.stat.late b{color:var(--late)}

h2.sec{font-size:15px;color:var(--muted);font-weight:700;margin:22px 0 8px}

/* 表單元件 */
input[type=text],input[type=search],input[type=number],input[type=date],textarea,select{
  width:100%;border:1px solid var(--line);background:#fff;border-radius:10px;padding:11px 12px;font-size:16px}
textarea{min-height:70px;resize:vertical}
label.f{display:block;margin-bottom:12px}
label.f > span{display:block;font-size:14px;color:var(--muted);margin-bottom:4px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 14px;font-size:15px;font-weight:500;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.out{background:var(--out);border-color:var(--out);color:#fff}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.danger{color:var(--late);border-color:#E9B8B3}
.btn.big{width:100%;padding:15px;font-size:18px;font-weight:700;border-radius:12px}
.btn.sm{padding:6px 10px;font-size:14px}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* 清單 */
.list{background:var(--surface);border-radius:14px;border:1px solid var(--line);overflow:hidden}
.item{display:flex;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.item:first-child{border-top:0}
button.item:active{background:#F4F7F6}
.item .grow{flex:1;min-width:0}
.item .title{font-family:var(--serif);font-weight:700;font-size:16px;line-height:1.35;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.item .meta{font-size:13px;color:var(--muted);margin-top:2px}
.empty{padding:28px 16px;text-align:center;color:var(--muted);font-size:15px}

.cover{width:44px;height:62px;border-radius:4px;background:var(--primary-soft);flex:none;object-fit:cover;
  display:grid;place-items:center;color:var(--primary);font-family:var(--serif);font-size:18px;font-weight:700;overflow:hidden;
  box-shadow:inset 3px 0 0 rgba(0,0,0,.12)}
.cover.lg{width:96px;height:136px;font-size:34px}

.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap}
.tag.in{background:var(--ok-soft);color:var(--ok)}
.tag.out{background:var(--out-soft);color:var(--out)}
.tag.late{background:var(--late-soft);color:var(--late)}
.copy-no{font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.03em}

.chips{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;font-size:14px}
.chip.active{background:var(--ink);border-color:var(--ink);color:#fff}
.toolbar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.toolbar input{flex:1;min-width:160px}

/* 底部抽屜 */
.backdrop{position:fixed;inset:0;background:rgba(20,30,32,.45);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--bg);border-radius:18px 18px 0 0;
  max-height:92vh;max-height:92dvh;display:flex;flex-direction:column;max-width:760px;margin:0 auto;
  animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.3}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet-head{display:flex;align-items:center;gap:8px;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.sheet-head h3{margin:0;flex:1;font-size:17px}
.sheet-body{overflow-y:auto;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));-webkit-overflow-scrolling:touch}
/* 底部固定按鈕列：內容再長，儲存／取消按鈕都一直看得到 */
.sheet-foot{position:sticky;bottom:calc(-16px - env(safe-area-inset-bottom,0px));margin:12px -16px calc(-16px - env(safe-area-inset-bottom,0px));
  padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px;z-index:2}
.sheet-foot .row2 .btn{padding:9px 10px}
.mini{font-size:13px;color:var(--muted);margin:0 0 10px}
details.notice summary{cursor:pointer;font-weight:700}
.f-compact label.f{margin-bottom:9px}
.f-compact input[type=text],.f-compact input[type=number]{padding:9px 11px}

.book-head{display:flex;gap:16px;margin-bottom:16px}
.book-head h4{font-family:var(--serif);font-size:21px;line-height:1.35;margin:0 0 6px}
.book-head .meta{color:var(--muted);font-size:14px}
.status-card{border-radius:14px;padding:14px 16px;margin-bottom:14px}
.status-card.in{background:var(--ok-soft)}
.status-card.out{background:var(--out-soft)}
.status-card.late{background:var(--late-soft)}
.status-card b{font-size:18px}
.notice{background:var(--primary-soft);border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:14px}
.notice.warn{background:var(--out-soft);color:#6B4309}

.stu-results{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 14px;max-height:220px;overflow-y:auto}
.stu{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 12px;font-size:15px;text-align:left}
.stu small{color:var(--muted);margin-left:4px}
.stu.sel{background:var(--primary);color:#fff;border-color:var(--primary)}
.stu.sel small{color:#CFE3E1}

/* 掃描畫面 */
#scanOverlay{position:fixed;inset:0;z-index:60;background:#000;color:#fff;display:flex;flex-direction:column}
#scanOverlay .bar{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 12px}
#scanOverlay .bar strong{flex:1;font-size:17px}
#scanOverlay .btn{color:#111}
#scanOverlay .btn.primary{color:#fff}
#camWrap{position:relative;flex:1;overflow:hidden;background:#000}
#camVideo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#camGuide{position:absolute;left:5%;right:5%;top:50%;height:min(42%,48vw);transform:translateY(-50%);border:3px solid rgba(255,255,255,.95);border-radius:14px;box-shadow:0 0 0 9999px rgba(0,0,0,.42);transition:border-color .15s}
#camGuide::after{content:"";position:absolute;left:6%;right:6%;top:50%;height:2px;background:rgba(255,80,80,.85)}
#camGuide.hit{border-color:#7FD69B}
#zoomBox{display:flex;align-items:center;gap:10px;padding:8px 16px;font-size:14px}
#zoomBox input{flex:1}
#scanManual{display:flex;gap:8px;margin:10px auto 0;max-width:420px}
#scanManual input{flex:1;min-width:0;background:#fff;color:#111}
#scanOverlay .hint{padding:14px 16px calc(18px + env(safe-area-inset-bottom,0px));text-align:center;font-size:15px;opacity:.9}
#scanMsg{margin:0 16px;padding:12px;border-radius:10px;text-align:center;font-weight:700;font-size:17px;min-height:48px}
#scanMsg.ok{background:var(--ok)}
#scanMsg.warn{background:#8F5B0E}

/* 提示訊息 */
#dlgBox{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:81;background:var(--surface);border-radius:16px;
  padding:20px 18px 16px;width:min(88vw,420px);box-shadow:0 12px 40px rgba(0,0,0,.25);display:flex;flex-direction:column;gap:14px}
#dlgMsg{white-space:pre-line;font-size:16px;line-height:1.6;max-height:55vh;overflow-y:auto}
#dlgBox .row2 .btn{padding:12px}
#dlgBox #dlgCancel[hidden]{display:none}
#dlgBox .row2:has(#dlgCancel[hidden]){grid-template-columns:1fr}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabbar) + 16px + env(safe-area-inset-bottom,0px));
  z-index:70;background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;font-size:15px;max-width:90vw;text-align:center;
  box-shadow:0 6px 20px rgba(0,0,0,.2)}
#setupBanner{background:var(--late-soft);color:var(--late);padding:12px 16px;font-size:14px}

/* 標籤列印 */
#printArea{display:none}
@media print{
  @page{size:A4;margin:0}
  body{background:#fff;padding:0}
  body > *:not(#printArea){display:none!important}
  #printArea{display:block}
  .label-sheet{width:210mm;display:grid;page-break-after:always}
  .label{box-sizing:border-box;overflow:hidden;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;line-height:1.15}
  .label .l-top,.label .l-title{color:#222;width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .label svg{display:block}
  .label .l-no{font-weight:700;letter-spacing:.08em}
  .stu-page{width:210mm;height:297mm;padding:10mm 12mm;box-sizing:border-box;page-break-after:always;overflow:hidden}
  .stu-head{display:flex;justify-content:space-between;align-items:flex-end;height:9mm;border-bottom:0.4mm solid #000;margin-bottom:2mm;font-size:10pt}
  .stu-head b{font-size:13pt}
  .stu-grid{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(8,33mm);grid-auto-flow:column}
  .stu-cell{border:0.2mm dashed #aaa;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
  .stu-cell .n{font-size:20pt;font-weight:700;line-height:1.2}
  .stu-cell .c{font-size:11pt;letter-spacing:.12em;margin-top:0.5mm}
  .idx-grid{column-count:4;column-gap:6mm;column-fill:auto;height:262mm}
  .idx-row{display:flex;align-items:baseline;font-size:10.5pt;line-height:5.4mm;break-inside:avoid}
  .idx-row .dots{flex:1;border-bottom:0.2mm dotted #888;margin:0 1.5mm;transform:translateY(-1mm)}
  .idx-row .pg{font-weight:700}
}
</style>
</head>
<body>

<header class="top">
  <h1>教室圖書借閱<span class="sub">KUMON 員林大同正興教室</span></h1>
  <span class="conn" id="conn" title="連線狀態"></span>
  <button class="icon-btn" data-act="openSettings" aria-label="設定">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
  </button>
</header>
<div id="setupBanner" hidden></div>

<main>
  <!-- 借還 -->
  <section class="tab-panel active" id="tab-home">
    <button class="scan-hero" data-act="scan">
      <svg viewBox="0 0 64 48" fill="currentColor" aria-hidden="true"><rect x="2" y="4" width="3" height="40"/><rect x="8" y="4" width="2" height="40"/><rect x="13" y="4" width="5" height="40"/><rect x="21" y="4" width="2" height="40"/><rect x="26" y="4" width="3" height="40"/><rect x="32" y="4" width="6" height="40"/><rect x="41" y="4" width="2" height="40"/><rect x="46" y="4" width="4" height="40"/><rect x="53" y="4" width="2" height="40"/><rect x="58" y="4" width="4" height="40"/></svg>
      <div><strong>掃描借還</strong><span>先掃學生條碼再掃書就能借書；掃冊號還書；掃 ISBN 新增書籍</span></div>
    </button>
    <div class="quick-row">
      <button class="btn big" data-act="scanReturn">連續還書</button>
      <button class="btn big" data-act="manualBook">手動新增書籍</button>
    </div>
    <form class="manual" id="manualForm">
      <input type="text" id="manualCode" placeholder="沒有相機時：輸入冊號或 ISBN" autocomplete="off" inputmode="text">
      <button class="btn primary" type="submit">查詢</button>
    </form>

    <div class="stats">
      <div class="stat"><b id="stOut">0</b><small>借出中</small></div>
      <div class="stat late"><b id="stLate">0</b><small>已逾期</small></div>
      <div class="stat"><b id="stBooks">0</b><small id="stBooksSub">種書</small></div>
    </div>

    <h2 class="sec">最近借還紀錄</h2>
    <div class="list" id="recentList"></div>
  </section>

  <!-- 借出中 -->
  <section class="tab-panel" id="tab-loans">
    <div class="chips" id="loanChips">
      <button class="chip active" data-filter="all">全部借出中</button>
      <button class="chip" data-filter="late">已逾期</button>
      <button class="chip" data-filter="soon">3 天內到期</button>
    </div>
    <div class="toolbar">
      <input type="search" id="loanSearch" placeholder="搜尋學生、書名或冊號">
      <button class="btn" data-act="copyLateList">複製逾期名單</button>
    </div>
    <div class="list" id="loanList"></div>
  </section>

  <!-- 書庫 -->
  <section class="tab-panel" id="tab-books">
    <div class="toolbar">
      <input type="search" id="bookSearch" placeholder="搜尋書名、作者、ISBN、冊號、分類">
      <select id="bookSort" style="width:auto;flex:none">
        <option value="stroke">依書名（筆畫）</option>
        <option value="zhuyin">依書名（注音）</option>
        <option value="copy">依冊號（書架順序）</option>
        <option value="new">最新建檔在前</option>
      </select>
    </div>
    <div class="toolbar">
      <button class="btn primary" data-act="scan">掃描新增</button>
      <button class="btn" data-act="manualBook">手動新增</button>
      <button class="btn" data-act="openPrint" id="printPendingBtn">列印標籤</button>
    </div>
    <div class="chips" id="bookCats"></div>
    <div class="chips" id="bookLevels" hidden></div>
    <div class="list" id="bookList"></div>
  </section>

  <!-- 學生 -->
  <section class="tab-panel" id="tab-students">
    <div class="toolbar">
      <input type="search" id="stuSearchTab" placeholder="搜尋學生姓名或暱稱">
      <button class="btn primary" data-act="addStudents">新增學生</button>
      <button class="btn" data-act="openStudentPrint">學生條碼</button>
    </div>
    <div class="chips" id="stuChips">
      <button class="chip active" data-filter="borrowing">目前有借書</button>
      <button class="chip" data-filter="all">全部學生</button>
    </div>
    <div class="list" id="studentList"></div>
    <div id="removedBox" style="margin-top:14px"></div>
  </section>
</main>

<nav class="tabbar">
  <button class="active" data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 5v14M6 5v14M10 5v14M13 5v14M17 5v14M21 5v14"/></svg>借還</button>
  <button data-tab="loans"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>借出中<span class="badge" id="lateBadge" hidden></span></button>
  <button data-tab="books"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h4v16H4zM10 4h4v16h-4zM16 5l3.5-1 3 15.5-3.5 1z"/></svg>書庫</button>
  <button data-tab="students"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4.5 4.5-6.5 8-6.5s7 2 8 6.5"/></svg>學生</button>
</nav>

<div id="sheetWrap" hidden>
  <div class="backdrop" data-act="closeSheet"></div>
  <div class="sheet" role="dialog" aria-modal="true">

/* ========== 網頁內建對話框（取代 confirm／prompt／alert） ==========

/* ========== 小工具 ========== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2, "0");
function ymd(d){ d = d || new Date(); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function addDays(n){ const d = new Date(); d.setDate(d.getDate()+n); return ymd(d); }
function daysLeft(due){ const t = new Date(ymd()+"T00:00:00"); const d = new Date(due+"T00:00:00"); return Math.round((d - t)/86400000); }
function md(s){ if(!s) return ""; const p = s.split("-"); return (+p[1])+"/"+(+p[2]); }
function fmtTime(ts){ if(!ts) return ""; const d = new Date(ts); return (d.getMonth()+1)+"/"+d.getDate()+" "+pad(d.getHours())+":"+pad(d.getMinutes()); }
function firstChar(t){ return esc((t||"書").trim().charAt(0) || "書"); }

/* ========== ISBN ========== */
function isbn13Valid(s){
  if(!/^97[89]\d{10}$/.test(s)) return false;
  let sum = 0; for(let i=0;i<12;i++) sum += (+s[i]) * (i%2 ? 3 : 1);
  return (10 - sum % 10) % 10 === +s[12];
}
function isbn10to13(s){
  if(!/^\d{9}[\dX]$/.test(s)) return null;
  let sum = 0; for(let i=0;i<10;i++) sum += (s[i]==="X"?10:+s[i]) * (10-i);
  if(sum % 11) return null;
  const b = "978" + s.slice(0,9); let t = 0;
  for(let i=0;i<12;i++) t += (+b[i]) * (i%2 ? 3 : 1);
  return b + ((10 - t%10) % 10);
}
function normalizeIsbn(raw){
  const s = String(raw).replace(/[-\s]/g, "").toUpperCase();
  if(isbn13Valid(s)) return s;
  return isbn10to13(s);
}

async function lookupIsbn(isbn){
  // 先用「ISBN 查詢小幫手」（Google Apps Script，查國圖／博客來），同時向 Google Books 查封面
  const proxy = (state.settings.isbnProxy || DEFAULT_ISBN_PROXY || "").trim();
  const gb = fetch("https://www.googleapis.com/books/v1/volumes?q=isbn:" + isbn).then(r => r.json()).catch(() => null);
  if(proxy){
    try{
      const j = await (await fetch(proxy + (proxy.indexOf("?") >= 0 ? "&" : "?") + "isbn=" + isbn)).json();
      if(j && j.ok && j.title){
        let cover = "";
        const g = await gb;
        if(g && g.items && g.items[0] && g.items[0].volumeInfo.imageLinks){ const il = g.items[0].volumeInfo.imageLinks; cover = (il.thumbnail || il.smallThumbnail || "").replace("http://", "https://"); }
        return { title:j.title, author:j.author || "", publisher:j.publisher || "", year:j.year || "", cover, source:j.source || "查詢小幫手" };
      }
    }catch(e){ console.warn("ISBN 查詢小幫手", e); }
  }
  try{
    const j = await gb;
    if(!j) throw new Error("Google Books 無回應");
    if(j.items && j.items.length){
      const v = j.items[0].volumeInfo || {};
      const img = v.imageLinks ? (v.imageLinks.thumbnail || v.imageLinks.smallThumbnail || "") : "";
      return { title:(v.title||"") + (v.subtitle ? "：" + v.subtitle : ""), author:(v.authors||[]).join("、"),
        publisher:v.publisher||"", year:(v.publishedDate||"").slice(0,4), cover:img.replace("http://","https://"), source:"Google Books" };
    }
  }catch(e){ console.warn("Google Books", e); }
  try{
    const r = await fetch("https://openlibrary.org/api/books?bibkeys=ISBN:" + isbn + "&format=json&jscmd=data");
    const j = await r.json(); const v = j["ISBN:" + isbn];
    if(v){
      const y = (v.publish_date||"").match(/\d{4}/);
      return { title:(v.title||"") + (v.subtitle ? "：" + v.subtitle : ""), author:(v.authors||[]).map(a=>a.name).join("、"),
        publisher:(v.publishers||[]).map(p=>p.name).join("、"), year:y ? y[0] : "", cover:(v.cover && (v.cover.medium||v.cover.small)) || "", source:"Open Library" };
    }
  }catch(e){ console.warn("Open Library", e); }
  return null;
}

/* ========== 資料查詢 ========== */
function copiesOf(bookId){
  return Object.keys(state.copies).filter(id => state.copies[id].bookId === bookId).sort().map(id => Object.assign({ id }, state.copies[id]));
}
function activeLoans(){
  return Object.keys(state.loans).filter(id => !state.loans[id].returnedAt).map(id => Object.assign({ id }, state.loans[id]));
}
/* 借還方式（建檔時決定）：
   scanBy = "isbn"  → 封面有 ISBN 條碼，借還直接掃 ISBN，不用貼冊號標籤
   scanBy = "label" → 封面沒有 ISBN 條碼（或沒有 ISBN），要貼冊號標籤，借還掃標籤
   不論哪一種，冊號標籤都一定可以用；掃 ISBN 時如果能判斷是哪一冊，也一樣可以借還 */
function usesIsbn(bookId){ const b = state.books[bookId]; return !!(b && b.isbn && b.scanBy === "isbn"); }
let scanSource = "manual"; // 最近一次代碼的來源：camera（掃到條碼）或 manual（手動輸入）
/* 用 ISBN 找出要借出／歸還的是哪一冊 */
function resolveIsbn(text, want){
  const isbn = normalizeIsbn(text); if(!isbn) return null;
  const bid = findBookByIsbn(isbn);
  if(!bid) return { error:"書庫裡沒有這個 ISBN 的書" };
  const cps = copiesOf(bid), list = cps.filter(c => want === "in" ? c.status !== "out" : c.status === "out");
  if(!list.length) return { error:want === "in" ? `「${bookTitle(bid)}」都借出了` : `「${bookTitle(bid)}」本來就在架上` };
  if(want === "out" && list.length > 1) return { error:`「${bookTitle(bid)}」有 ${list.length} 本借出中，請掃冊號標籤，或到書籍頁面選擇要歸還哪一本` };
  return { copyId:list[0].id };
}
function findBookByIsbn(isbn){ return Object.keys(state.books).find(id => state.books[id].isbn === isbn) || null; }
function studentName(id){ const s = state.students[id]; return s ? s.name : ""; }
function loansOfBorrower(key){
  return Object.keys(state.loans).map(id => Object.assign({ id }, state.loans[id])).filter(l => borrowerKey(l) === key);
}
function borrowerKey(l){ return l.studentId ? "s:" + l.studentId : "n:" + (l.borrowerName || ""); }
function loanStatus(l){
  if(l.returnedAt) return { cls:"in", text:"已歸還" };
  const d = daysLeft(l.dueDate);
  if(d < 0) return { cls:"late", text:"逾期 " + (-d) + " 天" };
  if(d === 0) return { cls:"out", text:"今天到期" };
  return { cls:"out", text:"剩 " + d + " 天" };
}
/* 借書規則：學生每次限借 2 本 14 天、家長每次限借 1 本 28 天；逾期停借一個週期 */
function ruleOf(type){
  const st = state.settings;
  return type === "parent" ? { days:+st.parentDays || 28, limit:+st.parentLimit || 1, label:"家長" }
                           : { days:+st.loanDays || 14, limit:+st.studentLimit || 2, label:"學生" };
}
function personKey(id, name, type){ return (id ? "s:" + id : "n:" + name) + "|" + (type || "student"); }
function loanPersonKey(l){ return personKey(l.studentId, l.baseName || l.borrowerName, l.borrowerType); }
function checkBorrow(p){
  const r = ruleOf(p.type), key = personKey(p.id, p.name, p.type);
  const mine = Object.values(state.loans).filter(l => loanPersonKey(l) === key);
  const active = mine.filter(l => !l.returnedAt);
  const problems = [];
  const late = active.filter(l => daysLeft(l.dueDate) < 0);
  if(late.length) problems.push(`有 ${late.length} 本逾期未還（${late.map(l => bookTitle(l.bookId, l.bookTitle)).join("、")}），請先歸還`);
  if(active.length >= r.limit) problems.push(`${r.label}每次限借 ${r.limit} 本，目前已借 ${active.length} 本，要先還書才能再借`);
  let banUntil = "";
  mine.filter(l => l.returnedAt && ymd(new Date(l.returnedAt)) > l.dueDate).forEach(l => {
    const d = state.settings.banFrom === "return" ? new Date(l.returnedAt) : new Date(l.dueDate + "T00:00:00");
    d.setDate(d.getDate() + r.days);
    const u = ymd(d); if(u > banUntil) banUntil = u;
  });
  if(banUntil && banUntil > ymd()) problems.push(`之前逾期還書，停借到 ${md(banUntil)}（含）前`);
  return { problems, active:active.length, r };
}
function bookTitle(bookId, fallback){ const b = state.books[bookId]; return b ? b.title : (fallback || "（書籍已刪除）"); }
function coverHtml(book, lg){
  const cls = "cover" + (lg ? " lg" : "");
  if(book && book.cover) return `<img class="${cls}" src="${esc(book.cover)}" alt="" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'${cls}',textContent:'${firstChar(book.title)}'}))">`;
  return `<div class="${cls}">${firstChar(book && book.title)}</div>`;
}

/* ========== Firebase ========== */
function init(){
  if(!window.firebase){ showSetup("Firebase 元件載入失敗，請確認網路連線後重新整理。"); return; }
  const cfg = Object.assign({}, FIREBASE_CONFIG);
  if(!cfg.apiKey || cfg.apiKey.indexOf("請") === 0) delete cfg.apiKey;
  try{ firebase.initializeApp(cfg); db = firebase.database(); }
  catch(e){ showSetup("Firebase 設定有誤：" + e.message); return; }

  db.ref(".info/connected").on("value", s => $("#conn").classList.toggle("on", !!s.val()));
  ["books","copies","loans","settings","studentCodes"].forEach(k => {
    db.ref(DB_ROOT + "/" + k).on("value", snap => {
      state[k] = snap.val() || {};
      if(k === "settings") state.settings = Object.assign({ loanDays:14, studentLimit:2, parentDays:28, parentLimit:1, banFrom:"due" }, state.settings);
      if(k === "books") migrateCategories();
      scheduleRender();
    }, err => showSetup("無法讀取圖書資料（" + err.code + "）。請到 Firebase 主控台的 Realtime Database 規則，允許讀寫 library 路徑。"));
  });
  ["extraStudents", "hiddenStudents"].forEach(k => db.ref(DB_ROOT + "/" + k).on("value", snap => { state[k] = snap.val() || {}; mergeStudents(); }));
  db.ref(STUDENT_PATH).on("value", snap => { state.reportStudents = snap.val() || {}; mergeStudents(); },
    err => showSetup("無法讀取學生名單（" + err.code + "）。"));
}
let catMigrated = false;
function migrateCategories(){
  if(catMigrated) return; catMigrated = true;
  const up = {};
  Object.keys(state.books).forEach(id => { const n = CAT_RENAME[state.books[id].category]; if(n) up["books/" + id + "/category"] = n; });
  if(Object.keys(up).length) db.ref(DB_ROOT).update(up).then(() => toast(`已依書庫規則統一分類名稱（${Object.keys(up).length} 本）`, 3500));
}
function mergeStudents(){
  const m = {};
  Object.keys(state.reportStudents).forEach(id => { if(!state.hiddenStudents[id]) m[id] = state.reportStudents[id]; });
  Object.keys(state.extraStudents).forEach(id => { m[id] = state.extraStudents[id]; });
  state.students = m; scheduleRender();
}
/* 學生條碼：library/studentCodes/{學生id} = { code:"S0001", printed:false } */
const STUDENT_PREFIX = "S";
function studentCode(sid){ const c = state.studentCodes[sid]; return c && c.code ? c.code : ""; }
function sidByCode(code){ return Object.keys(state.studentCodes).find(id => state.studentCodes[id].code === code && state.students[id]) || null; }
async function ensureStudentCodes(sids){
  const missing = sids.filter(id => !studentCode(id));
  if(!missing.length) return;
  const res = await db.ref(DB_ROOT + "/settings/nextStudentNo").transaction(v => (v || 1) + missing.length);
  const end = res.snapshot.val(), start = end - missing.length, up = {};
  missing.forEach((id, i) => up["studentCodes/" + id] = { code:STUDENT_PREFIX + String(start + i).padStart(4, "0"), printed:false });
  await db.ref(DB_ROOT).update(up);
}
function removedStudents(){
  return Object.keys(state.hiddenStudents).filter(id => state.reportStudents[id]).map(id => ({ id, name:state.reportStudents[id].name }));
}
function showSetup(msg){ const b = $("#setupBanner"); b.textContent = msg; b.hidden = false; }

/* 多個節點的更新會分開觸發，集中到下一個時間點再一次重畫，避免畫到一半的資料 */
let renderTimer = null;
function scheduleRender(){ clearTimeout(renderTimer); renderTimer = setTimeout(renderAll, 30); }

async function allocCopyIds(n){
  const res = await db.ref(DB_ROOT + "/settings/nextCopyNo").transaction(v => (v || 1) + n);
  const end = res.snapshot.val(), start = end - n;
  return Array.from({ length:n }, (_, i) => COPY_PREFIX + String(start + i).padStart(4, "0"));
}

async function borrowCopy(copyId, borrower, dueDate){
  const snap = await db.ref(DB_ROOT + "/copies/" + copyId).once("value");
  const c = snap.val();
  if(!c){ toast("找不到這一冊"); return false; }
  if(c.status === "out"){ toast(copyId + " 目前是借出狀態，請先歸還"); return false; }
  const loanId = db.ref().push().key;
  const up = {};
  up["loans/" + loanId] = { copyId, bookId:c.bookId, bookTitle:bookTitle(c.bookId), studentId:borrower.id || null,
    borrowerName:borrower.type === "parent" ? borrower.name + "（家長）" : borrower.name, baseName:borrower.name,
    borrowerType:borrower.type || "student", borrowedAt:Date.now(), dueDate, returnedAt:null };
  up["copies/" + copyId + "/status"] = "out";
  up["copies/" + copyId + "/loanId"] = loanId;
  await db.ref(DB_ROOT).update(up);
  return true;
}
async function returnCopy(copyId){
  const c = state.copies[copyId]; if(!c) return false;
  const up = {};
  if(c.loanId) up["loans/" + c.loanId + "/returnedAt"] = Date.now();
  up["copies/" + copyId + "/status"] = "in";
  up["copies/" + copyId + "/loanId"] = null;
  await db.ref(DB_ROOT).update(up);
  return true;
}

function renderLoans(){
  const q = $("#loanSearch").value.trim().toLowerCase();
  let list = activeLoans();
  if(loanFilter === "late") list = list.filter(l => daysLeft(l.dueDate) < 0);
  if(loanFilter === "soon") list = list.filter(l => { const d = daysLeft(l.dueDate); return d >= 0 && d <= 3; });
  if(q) list = list.filter(l => [l.borrowerName, bookTitle(l.bookId, l.bookTitle), l.copyId].join(" ").toLowerCase().includes(q));
  list.sort((a, b) => a.dueDate.localeCompare(b.dueDate));
  $("#loanList").innerHTML = list.map(l => {
    const st = loanStatus(l);
    return `<div class="item">

      <button class="btn sm ok" data-act="return" data-copy="${esc(l.copyId)}">歸還</button>

}

/* 書籍排序：數字依大小排（2 < 10 < 13 < 104），（一）（二）、卷壹卷貳、（上）（下）也照順序 */
const CN_NUM = { "一":1,"二":2,"三":3,"四":4,"五":5,"六":6,"七":7,"八":8,"九":9,"十":10,
  "壹":1,"貳":2,"參":3,"肆":4,"伍":5,"陸":6,"柒":7,"捌":8,"玖":9,"拾":10, "上":1,"中":2,"下":3 };
function sortKey(t){
  return String(t || "").replace(/([（(【\[]|卷|第)([一二三四五六七八九十壹貳參肆伍陸柒捌玖拾上中下])(?=[）)】\]部集冊卷篇]|$)/g,
    (m, pre, n) => pre + CN_NUM[n]);
}
const COLLATORS = {};
function collator(kind){
  if(!COLLATORS[kind]){
    try{ COLLATORS[kind] = new Intl.Collator(kind === "zhuyin" ? "zh-Hant-TW-u-co-zhuyin" : "zh-Hant-TW-u-co-stroke", { numeric:true }); }
    catch(e){ COLLATORS[kind] = new Intl.Collator("zh-Hant", { numeric:true }); }
  }
  return COLLATORS[kind];
}
function firstCopy(bookId){ return copiesOf(bookId)[0] ? copiesOf(bookId)[0].id : "Z"; }
function sortBookIds(ids, mode){
  const B = state.books;
  if(mode === "copy"){ const fc = {}; ids.forEach(id => fc[id] = firstCopy(id)); ids.sort((a, b) => fc[a].localeCompare(fc[b])); }
  else if(mode === "new") ids.sort((a, b) => (B[b].createdAt || 0) - (B[a].createdAt || 0) || firstCopy(b).localeCompare(firstCopy(a)));
  else { const c = collator(mode === "zhuyin" ? "zhuyin" : "stroke"); ids.sort((a, b) => c.compare(sortKey(B[a].title), sortKey(B[b].title))); }
  return ids;
}
function renderBooks(){
  const q = $("#bookSearch").value.trim().toLowerCase();
  const pending = Object.keys(state.copies).filter(id => !state.copies[id].labelPrinted).length;
  const pb = $("#printPendingBtn"); pb.textContent = pending ? "列印標籤（未印 " + pending + "）" : "列印標籤";
  let ids = Object.keys(state.books);
  // 年級分類按鈕
  const cnt = {};
  ids.forEach(id => { const c = state.books[id].category || "未分類"; cnt[c] = (cnt[c] || 0) + 1; });
  const cats = Object.keys(cnt).sort((a, b) => {
    const ia = CAT_ORDER.indexOf(a), ib = CAT_ORDER.indexOf(b);
    return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib) || a.localeCompare(b, "zh-Hant");
  });
  if(bookCat !== "all" && !cnt[bookCat]) bookCat = "all";
  $("#bookCats").innerHTML = `<button class="chip ${bookCat === "all" ? "active" : ""}" data-bcat="all">全部（${ids.length}）</button>`
    + cats.map(c => `<button class="chip ${bookCat === c ? "active" : ""}" data-bcat="${esc(c)}">${catDot(c)}${esc(c)}（${cnt[c]}）</button>`).join("");
  if(bookCat !== "all") ids = ids.filter(id => (state.books[id].category || "未分類") === bookCat);
  // 閱讀等級按鈕（該分類有等級資料時才顯示）
  const lv = {};
  ids.forEach(id => { const l = state.books[id].level; if(l) lv[l] = (lv[l] || 0) + 1; });
  const lvKeys = Object.keys(lv).sort();
  const lvBox = $("#bookLevels");
  lvBox.hidden = true; // 閱讀等級已不使用
  if(lvBox.hidden) bookLevel = "all";
  else {
    if(bookLevel !== "all" && !lv[bookLevel]) bookLevel = "all";
    lvBox.innerHTML = `<button class="chip ${bookLevel === "all" ? "active" : ""}" data-blv="all">全部等級</button>`
      + lvKeys.map(l => `<button class="chip ${bookLevel === l ? "active" : ""}" data-blv="${esc(l)}">${esc(l)}（${lv[l]}）</button>`).join("");
    if(bookLevel !== "all") ids = ids.filter(id => state.books[id].level === bookLevel);
  }
  if(q){
    ids = ids.filter(id => {
      const b = state.books[id];
      const cps = copiesOf(id).map(c => c.id).join(" ");
      return [b.title, b.author, b.publisher, b.isbn, b.category, cps].join(" ").toLowerCase().includes(q);
    });
  }
  sortBookIds(ids, $("#bookSort").value);
  $("#bookList").innerHTML = ids.map(id => {
    const b = state.books[id], cps = copiesOf(id), inN = cps.filter(c => c.status !== "out").length;
    return `<button class="item" data-act="openBook" data-id="${esc(id)}">
      ${coverHtml(b)}
      <div class="grow"><div class="title">${esc(b.title)}</div>
      <div class="meta">${b.category ? catDot(b.category) + esc(b.category) + "　" : ""}${esc(b.author || "")}</div></div>
      <span class="tag ${inN ? "in" : "out"}">在架 ${inN}/${cps.length}</span>
    </button>`;
  }).join("") || `<div class="empty">${q ? "找不到符合的書。" : "書庫還是空的。按「掃描新增」掃書背的 ISBN 條碼開始建檔。"}</div>`;
}

function renderStudents(){
  const q = $("#stuSearchTab").value.trim().toLowerCase();
  const act = activeLoans();
  const counts = {};
  act.forEach(l => { const k = borrowerKey(l); counts[k] = (counts[k] || 0) + 1; });
  let rows = [];
  if(stuFilter === "all"){
    rows = Object.keys(state.students).map(id => ({ key:"s:" + id, name:state.students[id].name, nick:state.students[id].nickname || "" }));
  } else {
    const seen = {};
    act.forEach(l => { const k = borrowerKey(l); if(!seen[k]){ seen[k] = 1; const s = l.studentId && state.students[l.studentId];
      rows.push({ key:k, name:(s && s.name) || l.baseName || l.borrowerName, nick:s ? (s.nickname || "") : "" }); } });

       <button class="btn sm" data-act="restoreStudent" data-id="${esc(r.id)}">恢復</button></div>`).join("")}</div></details>` : "";

function renderPickResults(){
  const q = ($("#pickSearch").value || "").trim().toLowerCase();
  const act = activeLoans();
  const cnt = {}; act.forEach(l => { if(l.studentId) cnt[l.studentId] = (cnt[l.studentId] || 0) + 1; });
  let ids = Object.keys(state.students);
  if(q) ids = ids.filter(id => ((state.students[id].name || "") + " " + (state.students[id].nickname || "")).toLowerCase().includes(q));
  ids.sort((a, b) => (state.students[a].name || "").localeCompare(state.students[b].name || "", "zh-Hant"));
  let html = ids.slice(0, 40).map(id => {
    const s = state.students[id];
    return `<button type="button" class="stu ${pick && pick.id === id ? "sel" : ""}" data-act="pickStu" data-id="${esc(id)}">${esc(s.name)}${cnt[id] ? `<small>已借${cnt[id]}</small>` : ""}</button>`;
  }).join("");
  if(!q && ids.length > 40) html += `<div class="meta" style="width:100%;color:var(--muted);font-size:13px">共 ${ids.length} 位，請輸入姓名縮小範圍</div>`;
  if(q && !ids.length) html = `<button type="button" class="stu ${pick && !pick.id ? "sel" : ""}" data-act="pickOther">名單外借閱人：「${esc(q)}」</button>`;
  if(!Object.keys(state.students).length) html = `<div class="notice warn" style="width:100%">讀不到學生名單，可直接輸入姓名，再點「名單外借閱人」。</div>` + (q ? html : "");
  $("#pickResults").innerHTML = html;
  const btn = $("#borrowBtn"), warn = $("#pickWarn");
  if(!pick){ btn.disabled = true; btn.textContent = "請先選擇學生"; warn.innerHTML = ""; return; }
  const who = pick.name + (pickType === "parent" ? "（家長）" : "");
  const chk = checkBorrow({ id:pick.id, name:pick.name, type:pickType });
  if(chk.problems.length){
    const ok = $("#pickOverride") && $("#pickOverride").checked;
    warn.innerHTML = `<div class="notice warn"><b>依書庫規則不能借：</b><br>${chk.problems.map(esc).join("<br>")}
      <label style="display:flex;gap:8px;align-items:center;margin-top:8px"><input type="checkbox" id="pickOverride" ${ok ? "checked" : ""}> 老師特例允許借出</label></div>`;
    $("#pickOverride").addEventListener("change", renderPickResults);
    btn.disabled = !ok; btn.textContent = ok ? "特例借給 " + who : "不符合借書規則";
  } else {
    warn.innerHTML = chk.active ? `<div class="notice">目前已借 ${chk.active} 本，還可以再借 ${chk.r.limit - chk.active} 本。</div>` : "";
    btn.disabled = false; btn.textContent = "借給 " + who;
  }
}

function compressImage(file, maxW){
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => {
      const s = Math.min(1, maxW / img.width);
      const cv = document.createElement("canvas");
      cv.width = Math.round(img.width * s); cv.height = Math.round(img.height * s);
      cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
      URL.revokeObjectURL(img.src);
      res(cv.toDataURL("image/jpeg", 0.75));
    };
    img.onerror = rej;
    img.src = URL.createObjectURL(file);
  });
}

/* 書名比對：去掉標點空白後，用「兩字片段」重疊程度算相似度（0～1） */
function normTitle(t){ return String(t || "").replace(/[\s　:：,，.。．・·!！?？()（）「」『』《》〈〉\[\]【】\-—_~～、;；'"＂]/g, "").toLowerCase(); }
function bigrams(t){ const a = []; for(let i = 0; i < t.length - 1; i++) a.push(t.slice(i, i + 2)); return a.length ? a : [t]; }
function titleSim(ra, rb){
  const a = normTitle(ra), b = normTitle(rb);
  if(!a || !b) return 0;
  if(a === b) return 1;
  // 集數不同（例：瘋狂樹屋13層 vs 26層）視為不同的書
  const da = (a.match(/\d+/g) || []).join(","), db = (b.match(/\d+/g) || []).join(",");
  const penalty = da && db && da !== db ? 0.4 : 1;
  if(a.length >= 4 && b.length >= 4 && (a.includes(b) || b.includes(a))) return 0.9 * penalty;
  // 書名分段（以冒號、括號切開）後，任一段落（4 字以上）出現在另一本書名中
  const segs = t => String(t || "").split(/[:：()（）]/).map(normTitle).filter(x => x.length >= 4);
  if(segs(ra).some(x => b.includes(x)) || segs(rb).some(x => a.includes(x))) return 0.85 * penalty;
  const A = bigrams(a), B = bigrams(b), setB = {};
  B.forEach(x => setB[x] = (setB[x] || 0) + 1);
  let hit = 0; A.forEach(x => { if(setB[x]){ hit++; setB[x]--; } });
  return 2 * hit / (A.length + B.length) * penalty;
}
function similarBooks(title, onlyNoIsbn){
  return Object.keys(state.books)
    .filter(id => !onlyNoIsbn || !state.books[id].isbn)
    .map(id => ({ id, score:titleSim(title, state.books[id].title) }))
    .filter(x => x.score >= 0.5).sort((a, b) => b.score - a.score).slice(0, 4);
}

/* ---------- 相機與條碼辨識 ----------
   辨識引擎：手機內建 BarcodeDetector（Android Chrome）＋ zxing-wasm（所有手機，含 iPhone），兩者輪流使用。
   只辨識畫面上白框範圍（放大取樣），框外不看，所以看到的就是實際在掃的範圍。 */
let cam = { stream:null, track:null, timer:0, frame:0, torch:false };
let nativeDet = null, nativeChecked = false;
async function getNativeDetector(){
  if(nativeChecked) return nativeDet;
  nativeChecked = true;
  try{
    if("BarcodeDetector" in window){
      const f = await BarcodeDetector.getSupportedFormats();
      if(f.includes("ean_13")) nativeDet = new BarcodeDetector({ formats:["ean_13", "code_128", "upc_a"].filter(x => f.includes(x)) });
    }
  }catch(e){ nativeDet = null; }
  return nativeDet;
}
async function decodeCanvas(cv, useNative){
  const nd = await getNativeDetector();
  if(useNative && nd){
    try{ const r = await nd.detect(cv); if(r.length && r[0].rawValue) return r[0].rawValue; }catch(e){}
    if(!window.ZXingWASM) return null;
  }
  if(!window.ZXingWASM) return null;
  const img = cv.getContext("2d", { willReadFrequently:true }).getImageData(0, 0, cv.width, cv.height);
  const r = await ZXingWASM.readBarcodes(img, { formats:["EAN13", "Code128", "UPCA"], tryHarder:true, maxNumberOfSymbols:1 });
  const ok = r.find(x => x.isValid && x.text);
  return ok ? ok.text : null;
}
async function startCamera(){
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error("這個瀏覽器不支援相機");
  const video = $("#camVideo");
  const stream = await navigator.mediaDevices.getUserMedia({ audio:false,
    video:{ facingMode:{ ideal:"environment" }, width:{ ideal:1920 }, height:{ ideal:1080 } } });
  cam.stream = stream; cam.track = stream.getVideoTracks()[0]; cam.frame = 0; cam.torch = false;
  video.srcObject = stream;
  try{ await video.play(); }catch(e){}
  const caps = cam.track.getCapabilities ? cam.track.getCapabilities() : {};
  const adv = {};
  if(caps.focusMode && caps.focusMode.includes("continuous")) adv.focusMode = "continuous";
  // 稍微放大 1.5 倍：手機不用貼太近，比較容易對焦
  if(caps.zoom && caps.zoom.max >= 1.5) adv.zoom = Math.max(caps.zoom.min || 1, 1.5);
  if(Object.keys(adv).length){ try{ await cam.track.applyConstraints({ advanced:[adv] }); }catch(e){} }
  $("#torchBtn").hidden = !caps.torch;
  const zb = $("#zoomBox"), zr = $("#zoomRange");
  if(caps.zoom && caps.zoom.max > (caps.zoom.min || 1)){
    zb.hidden = false; zr.min = caps.zoom.min || 1; zr.max = Math.min(caps.zoom.max, 5); zr.step = caps.zoom.step || 0.1;
    zr.value = adv.zoom || caps.zoom.min || 1;
  } else zb.hidden = true;
  scheduleFrame();
}
function scheduleFrame(){ clearTimeout(cam.timer); cam.timer = setTimeout(scanFrame, 110); }
async function scanFrame(){
  if(!cam.stream) return;
  const v = $("#camVideo");
  if(v.readyState >= 2 && v.videoWidth && !scanBusy){
    try{
      // 把畫面上的白框，換算回攝影機原始畫面的位置（影片是 object-fit:cover）
      const wrap = $("#camWrap").getBoundingClientRect(), g = $("#camGuide").getBoundingClientRect();
      const vw = v.videoWidth, vh = v.videoHeight;
      const sc = Math.max(wrap.width / vw, wrap.height / vh);
      const offX = (vw * sc - wrap.width) / 2, offY = (vh * sc - wrap.height) / 2;
      const padX = g.width * 0.06, padY = g.height * 0.15; // 框外多取一點，邊緣也掃得到
      let sx = (g.left - wrap.left - padX + offX) / sc, sy = (g.top - wrap.top - padY + offY) / sc;
      let sw = (g.width + padX * 2) / sc, sh = (g.height + padY * 2) / sc;
      sx = Math.max(0, sx); sy = Math.max(0, sy); sw = Math.min(vw - sx, sw); sh = Math.min(vh - sy, sh);
      const k = Math.min(1, 1400 / sw);
      const cv = $("#camCanvas"); cv.width = Math.round(sw * k); cv.height = Math.round(sh * k);
      cv.getContext("2d", { willReadFrequently:true }).drawImage(v, sx, sy, sw, sh, 0, 0, cv.width, cv.height);
      cam.frame++;
      const text = await decodeCanvas(cv, cam.frame % 2 === 0);
      if(text && cam.stream){
        const gEl = $("#camGuide"); gEl.classList.add("hit"); setTimeout(() => gEl.classList.remove("hit"), 400);
        scanSource = "camera"; await onScan(text);
      }
    }catch(e){ console.warn(e); }
  }
  if(cam.stream) scheduleFrame();
}
function stopCamera(){
  clearTimeout(cam.timer);
  if(cam.stream){ cam.stream.getTracks().forEach(t => t.stop()); }
  cam.stream = null; cam.track = null;
  const v = $("#camVideo"); if(v) v.srcObject = null;
}
$("#zoomRange").addEventListener("input", e => {
  if(cam.track) cam.track.applyConstraints({ advanced:[{ zoom:parseFloat(e.target.value) }] }).catch(() => {});
});
$("#scanManual").addEventListener("submit", async e => {
  e.preventDefault();
  const v = $("#scanManualInput").value.trim(); if(!v) return;
  $("#scanManualInput").value = ""; $("#scanManualInput").blur();
  lastCode = ""; scanSource = "manual"; await onScan(v);
});
/* 備用：用手機相機拍一張照片來辨識（對焦較好，iPhone 特別適用） */
document.addEventListener("change", async e => {
  if(e.target.id !== "snapFile") return;
  const file = e.target.files[0]; e.target.value = "";
  if(!file) return;
  try{
    const bmp = await new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = URL.createObjectURL(file); });
    const k = Math.min(1, 2200 / Math.max(bmp.naturalWidth, bmp.naturalHeight));
    const cv = document.createElement("canvas"); cv.width = Math.round(bmp.naturalWidth * k); cv.height = Math.round(bmp.naturalHeight * k);
    cv.getContext("2d", { willReadFrequently:true }).drawImage(bmp, 0, 0, cv.width, cv.height);
    URL.revokeObjectURL(bmp.src);
    const text = (await decodeCanvas(cv, true)) || (await decodeCanvas(cv, false));
    if(text){ lastCode = ""; scanSource = "camera"; await onScan(text); }
    else toast("照片裡找不到條碼，請靠近一點、讓條碼清楚又平整再拍一次", 3500);
  }catch(err){ toast("照片讀取失敗", 3000); }
});
async function onScan(text){
  const now = Date.now();
  if(scanBusy) return;
  if(text === lastCode && now - lastAt < 3000) return;
  lastCode = text; lastAt = now;
  if(navigator.vibrate) navigator.vibrate(60);
  text = String(text).trim();
  if(scanMode === "return"){
    scanBusy = true;
    let id = text.trim().toUpperCase();
    const msg = $("#scanMsg");
    if(!state.copies[id]){
      const r = resolveIsbn(id, "out");
      if(r && r.copyId) id = r.copyId;
      else if(r){ msg.className = "warn"; msg.textContent = r.error; scanBusy = false; return; }
    }
    const c = state.copies[id];
    if(c && c.status === "out"){
      const l = state.loans[c.loanId] || {};
      await returnCopy(id); returnCount++;
      msg.className = "ok"; msg.textContent = `✓ ${id} ${l.borrowerName || ""} 已歸還（本次第 ${returnCount} 本）`;
    } else if(c){
      msg.className = "warn"; msg.textContent = `${id} 本來就在架上`;
    } else {
      msg.className = "warn"; msg.textContent = "請掃書上的冊號標籤（" + COPY_PREFIX + " 開頭）或封面的 ISBN 條碼";
    }
    scanBusy = false; return;
  }
  if(scanMode === "borrowFor"){
    scanBusy = true;
    let id = text.trim().toUpperCase();
    const msg = $("#scanMsg");
    if(!state.copies[id]){
      const r = resolveIsbn(id, "in");
      if(r && r.copyId) id = r.copyId;
      else if(r){ msg.className = "warn"; msg.textContent = r.error; scanBusy = false; return; }
    }
    const c = state.copies[id];
    if(!c){ msg.className = "warn"; msg.textContent = "請掃書上的冊號標籤（" + COPY_PREFIX + " 開頭）或封面的 ISBN 條碼"; }
    else if(c.status === "out"){ msg.className = "warn"; msg.textContent = `${id} 目前是借出狀態，要先歸還`; }
    else {
      const chk = checkBorrow(borrowFor);
      if(chk.problems.length){ msg.className = "warn"; msg.textContent = "✘ " + chk.problems[0]; }
      else {
        const due = addDays(ruleOf(borrowFor.type).days);
        if(await borrowCopy(id, borrowFor, due)){
          borrowCount++;
          const left = chk.r.limit - chk.active - 1;
          msg.className = "ok"; msg.textContent = `✓ ${bookTitle(c.bookId)} 已借出，${md(due)} 到期` + (left > 0 ? `（還可借 ${left} 本）` : "（已借滿）");
        }
      }
    }
    scanBusy = false; return;
  }
  if(scanMode === "pickStudent"){
    const sid = sidByCode(text.trim().toUpperCase());
    if(!sid){ const msg = $("#scanMsg"); msg.hidden = false; msg.className = "warn"; msg.textContent = "這不是學生條碼"; return; }
    await closeScan();
    pick = { id:sid, name:state.students[sid].name }; renderPickResults();
    return;
  }
  await closeScan();
  handleCode(text);
}
async function closeScan(){
  stopCamera();
  $("#scanOverlay").hidden = true;
  if(scanMode === "return" && returnCount) toast("本次共歸還 " + returnCount + " 本");
  if(scanMode === "borrowFor" && borrowCount) toast(`${borrowFor.name} 這次借了 ${borrowCount} 本`);
  if(scanMode === "borrowFor") borrowFor = null;
  scanMode = "normal";
}

function handleCode(raw){
  const code = String(raw).trim().toUpperCase();
  if(!code) return;
  const sid = sidByCode(code);
  if(sid){ // 掃到學生條碼：直接進入「幫這位學生借書」，接著掃書即可
    borrowFor = { id:sid, name:state.students[sid].name, type:"student" };
    startScan("borrowFor"); return;
  }
  if(state.copies[code]){
    if(state.copies[code].status === "out") openSheet({ type:"copy-return", id:code });
    else openBorrowForm(code);
    return;
  }
  const isbn = normalizeIsbn(code);
  if(isbn){
    const bid = findBookByIsbn(isbn);
    if(bid){
      const cps = copiesOf(bid), inC = cps.filter(c => c.status !== "out"), outC = cps.filter(c => c.status === "out");
      if(inC.length && !outC.length) openBorrowForm(inC[0].id);                 // 都在架上 → 借出
      else if(!inC.length && outC.length === 1) openSheet({ type:"copy-return", id:outC[0].id }); // 唯一一本借出中 → 歸還
      else openSheet({ type:"book", id:bid });                                     // 有借有在架 → 到書籍頁面選
      return;
    }
    openNewBook(isbn, scanSource);
    return;
  }
  const digits = code.replace(/[-\s]/g, "");
  if(/^97[89]\d{10}$/.test(digits)) toast("ISBN 最後一碼（檢查碼）對不上，請再確認一次數字", 3800);
  else if(/^\d+$/.test(digits)) toast(`ISBN 應該是 13 碼（978 或 979 開頭），你輸入了 ${digits.length} 碼`, 3800);
  else toast("無法辨識「" + raw + "」：不是冊號、學生條碼，也不是有效的 ISBN", 3500);
}

/* 列印時暫時把網頁標題改成檔名（另存 PDF 時的預設檔名） */
function printAs(name){
  const old = document.title;
  document.title = "教室圖書借閱_" + name;
  window.print();
  setTimeout(() => { document.title = old; }, 1000);
}
/* 通用條碼標籤列印：items = [{ code, text }]，版面：編號在上、條碼在中、文字在下 */
function printCodeLabels(items, kind, markPrinted){
  const ids = items.map(x => x.code);
  if(!ids.length){ toast("沒有要列印的標籤"); return; }
  if(!window.JsBarcode){ toast("條碼元件載入失敗，請檢查網路"); return; }
  const area = $("#printArea"); area.innerHTML = "";
  const f = labelFormat(), per = f.cols * f.rows;
  for(let i = 0; i < ids.length; i += per){
    const pg = document.createElement("div"); pg.className = "label-sheet";
    pg.style.gridTemplateColumns = `repeat(${f.cols}, ${f.w}mm)`;
    pg.style.gridAutoRows = `${f.h}mm`;
    items.slice(i, i + per).forEach(item => {
      const id = item.code;
      const el = document.createElement("div"); el.className = "label";
      el.style.padding = f.pad;
      const title = `<div class="l-title" style="font-size:${f.tx}">${esc(item.text)}</div>`;
      // 版面：冊號在上、條碼在中、書名在下（大標籤另外在最下方加教室名稱）
      el.innerHTML = `<div class="l-no" style="font-size:${f.no}">${esc(id)}</div>`
        + `<svg style="width:${f.bw}mm;height:${f.bh}mm;margin:0.6mm 0 1.4mm;overflow:hidden"></svg>`
        + title
        + (f.top ? `<div class="l-top" style="font-size:${f.tx};color:#666">${esc(CLASSROOM_NAME)}</div>` : "");
      JsBarcode(el.querySelector("svg"), id, { format:"CODE128", width:2, height:50, displayValue:false, margin:0 });
      const sv = el.querySelector("svg");
      sv.setAttribute("viewBox", `0 0 ${parseFloat(sv.getAttribute("width"))} ${parseFloat(sv.getAttribute("height"))}`);
      sv.removeAttribute("width"); sv.removeAttribute("height");
      sv.setAttribute("preserveAspectRatio", "none");
      sv.style.cssText = `display:block;width:${f.bw}mm;height:${f.bh}mm;margin:0.6mm 0 1.4mm;flex:none`; // JsBarcode 會覆寫 style，需在之後設定
      pg.appendChild(el);
    });
    area.appendChild(pg);
  }
  setTimeout(() => {
    printAs(kind);
    setTimeout(async () => {
      if(await askConfirm(`這 ${ids.length} 張${kind}（${Math.ceil(ids.length / per)} 頁）都已經印好了嗎？\n\n按「確定」會標記為已列印。\n只是測試或只印了部分頁數，請按「取消」。`)){
        markPrinted().then(() => toast("已標記為已列印"));
      }
    }, 300);
  }, 100);
}

/* ========== 匯入 ========== */
let pendingImport = null;
function catRows(){
  const cnt = {};
  Object.values(state.books).forEach(b => { if(b.category) cnt[b.category] = (cnt[b.category] || 0) + 1; });
  return Object.keys(cnt).sort().map(c => `<div class="item"><div class="grow">${esc(c)}<div class="meta">${cnt[c]} 種</div></div>
    <button class="btn sm" data-act="renameCat" data-cat="${esc(c)}">改名</button></div>`).join("");
}
document.addEventListener("change", async e => {
  if(e.target.id !== "importFile") return;
  const f = e.target.files[0]; if(!f) return;
  const msg = $("#importMsg");
  try{
    const data = JSON.parse(await f.text());
    const all = (data.books || []).filter(b => b && b.title)
      .map(b => Object.assign({}, b, { copies:Math.min(50, Math.max(1, parseInt(b.copies, 10) || 1)) }));
    const have = new Set(Object.values(state.books).map(b => (b.title || "").trim()));
    const list = all.filter(b => !have.has(b.title.trim()));
    const skip = all.length - list.length, total = list.reduce((s, b) => s + b.copies, 0);
    const flagged = list.filter(b => b.note).length;
    pendingImport = list.length ? list : null;
    msg.innerHTML = `<div class="notice" style="margin-top:12px">檔案裡有 ${all.length} 種書。${skip ? `其中 ${skip} 種書庫已經有了，會略過。` : ""}<br>
      將匯入 <b>${list.length} 種、${total} 冊</b>${flagged ? `，其中 ${flagged} 種有「待確認」備註` : ""}。</div>
      ${list.length ? `<button class="btn big primary" data-act="doImport">確認匯入</button>` : ""}`;
  }catch(err){ msg.innerHTML = `<div class="notice warn" style="margin-top:12px">讀不到這個檔案：${esc(err.message)}</div>`; }
  e.target.value = "";
});

    const n = (await askPrompt("修改姓名：", cur) || "").trim();
    if(!n || n === cur) return;
    if(state.extraStudents[id]) await db.ref(DB_ROOT + "/extraStudents/" + id + "/name").set(n);
    else { await showAlert("這位學生來自學習報告系統，請到學習報告系統修改姓名，兩邊會自動同步。"); return; }
    toast("已修改");
  },
  removeStudent: async el => {
    const id = el.dataset.id, s = state.students[id];
    const n = activeLoans().filter(l => l.studentId === id).length;
    if(n){ await showAlert(`${s.name} 還有 ${n} 本書沒還（含家長借的），全部歸還後才能移除。`); return; }
    if(!await askConfirm(`把 ${s.name} 從借書名單移除？\n借閱紀錄會保留，之後可以在「全部學生」最下方恢復。`)) return;
    if(state.extraStudents[id]) await db.ref(DB_ROOT + "/extraStudents/" + id).remove();
    else await db.ref(DB_ROOT + "/hiddenStudents/" + id).set(true);
    toast("已移除"); closeSheet();
  },
  restoreStudent: async el => { await db.ref(DB_ROOT + "/hiddenStudents/" + el.dataset.id).remove(); toast("已恢復"); },
  linkIsbn: async el => {
    const id = el.dataset.id, isbn = el.dataset.isbn, b = state.books[id];
    if(!await askConfirm(`把 ISBN ${isbn} 補到「${b.title}」？`)) return;
    const up = { isbn };
    const info = sheet && sheet.lookup;
    if(info){
      if(!b.cover && info.cover) up.cover = info.cover;
      if(!b.author && info.author) up.author = info.author;
      if(!b.publisher && info.publisher) up.publisher = info.publisher;
      if(!b.year && info.year) up.year = info.year;
    }
    if(scanSource === "camera" && await askConfirm("這本書封面有 ISBN 條碼。\n以後借還要直接掃 ISBN 條碼嗎？\n（選「改用 ISBN」就不用再貼冊號標籤）", "改用 ISBN")) up.scanBy = "isbn";
    await db.ref(DB_ROOT + "/books/" + id).update(up);
    if(up.scanBy === "isbn"){ const u2 = {}; copiesOf(id).forEach(c => u2["copies/" + c.id + "/labelPrinted"] = true); await db.ref(DB_ROOT).update(u2); }
    toast("已補上 ISBN"); openSheet({ type:"book", id });
  },
  pickImport: () => $("#importFile").click(),
  renameCat: async el => {
    const from = el.dataset.cat;
    const to = (await askPrompt(`把分類「${from}」改名為：`, from) || "").trim();
    if(!to || to === from) return;
    const up = {};
    Object.keys(state.books).forEach(id => { if(state.books[id].category === from) up["books/" + id + "/category"] = to; });
    await db.ref(DB_ROOT).update(up);
    toast(`已改名，共 ${Object.keys(up).length} 本`); actions.openSettings();
  },
  clearCover: () => { $("#fCover").value = ""; $("#coverPreview").innerHTML = coverHtml({ title:$("#fTitle").value }); },
  addCopies: async el => {
    const n = parseInt(await askPrompt("要增加幾冊？", "1"), 10);
    if(!n || n < 1 || n > 50) return;
    const ids = await allocCopyIds(n), up = {}, now = Date.now();
    ids.forEach(id => up["copies/" + id] = { bookId:el.dataset.id, status:"in", createdAt:now, labelPrinted:usesIsbn(el.dataset.id) });
    await db.ref(DB_ROOT).update(up);
    toast("已新增 " + ids.join("、"), 3500);
  },
  removeCopy: async el => {
    const cps = copiesOf(el.dataset.id).filter(c => c.status !== "out");
    if(!cps.length){ toast("沒有在架上的冊可以移除"); return; }
    const id = (await askPrompt("要移除哪一冊？（遺失或損壞）\n在架的冊號：" + cps.map(c => c.id).join("、")) || "").trim().toUpperCase();
    if(!id) return;
    if(!cps.some(c => c.id === id)){ toast("冊號不對，或那一冊目前借出中"); return; }
    await db.ref(DB_ROOT + "/copies/" + id).remove();
    toast(id + " 已移除");
  },
  deleteBook: async el => {
    const id = el.dataset.id, cps = copiesOf(id);
    if(cps.some(c => c.status === "out")){ toast("還有冊借出中，全部歸還後才能刪除"); return; }
    if(!await askConfirm(`刪除「${bookTitle(id)}」和它的 ${cps.length} 冊？借閱歷史會保留書名。`)) return;
    const up = {}; up["books/" + id] = null; cps.forEach(c => up["copies/" + c.id] = null);
    await db.ref(DB_ROOT).update(up);
    toast("已刪除"); closeSheet();
  },
  printBook: el => printLabels(copiesOf(el.dataset.id).map(c => c.id)),
  openPrint: () => {
    sheet = { type:"form" }; showSheetWrap(); document.body.style.overflow = "hidden";
    const all = Object.keys(state.copies).filter(id => !usesIsbn(state.copies[id].bookId)), pend = all.filter(id => !state.copies[id].labelPrinted);
    const cats = {};
    all.forEach(id => { const b = state.books[state.copies[id].bookId]; const c = (b && b.category) || "未分類"; cats[c] = (cats[c] || 0) + 1; });
    const f = labelFormat(), per = f.cols * f.rows;
    setSheet("列印標籤", `
      <div class="notice">目前標籤規格：${esc(f.name)}，每頁 ${per} 張。要換規格請到「設定」。</div>
      <label class="f"><span>列印範圍</span>
      <select id="pRange">
        <option value="all">全部標籤（${all.length} 張，約 ${Math.ceil(all.length / per)} 頁）</option>
        <option value="pending" ${pend.length ? "" : "disabled"}>只印未印過的（${pend.length} 張）</option>
        ${Object.keys(cats).sort().map(c => `<option value="cat:${esc(c)}">分類：${esc(c)}（${cats[c]} 張）</option>`).join("")}
      </select></label>
      <label class="f"><span>或指定冊號範圍（可留空，例：B0001～B0060）</span>
      <div class="row2"><input type="text" id="pFrom" placeholder="從 B0001"><input type="text" id="pTo" placeholder="到 B0060"></div></label>
      <p style="font-size:14px;color:var(--muted);margin:0 0 12px">調整版面時建議先填 B0001～B0060 只印一頁測試。</p>
      <button class="btn big primary" data-act="doPrint">產生標籤並列印</button>`);
  },
  doPrint: () => {
    const all = Object.keys(state.copies).sort();
    const from = $("#pFrom").value.trim().toUpperCase(), to = $("#pTo").value.trim().toUpperCase();
    let ids;
    if(from || to){
      ids = all.filter(id => (!from || id >= from) && (!to || id <= to));
    } else {
      const r = $("#pRange").value;
      const need = id => !usesIsbn(state.copies[id].bookId); // 用 ISBN 借還的書不用印標籤
      if(r === "pending") ids = all.filter(id => !state.copies[id].labelPrinted && need(id));
      else if(r.indexOf("cat:") === 0){ const c = r.slice(4); ids = all.filter(id => { const b = state.books[state.copies[id].bookId]; return ((b && b.category) || "未分類") === c && need(id); }); }
      else ids = all.filter(need);
    }
    if(!ids.length){ toast("這個範圍沒有標籤"); return; }
    closeSheet(); printLabels(ids);
  },
  resetLabels: async () => {
    if(!await askConfirm("把全部標籤都改回「未印」？（只影響列印紀錄，不會動到書籍和借閱資料）")) return;
    const up = {}; Object.keys(state.copies).forEach(id => up["copies/" + id + "/labelPrinted"] = false);
    await db.ref(DB_ROOT).update(up); toast("已全部改回未印");
  },
  printPending: () => printLabels(Object.keys(state.copies).filter(id => !state.copies[id].labelPrinted).sort()),
  copyLateList: async () => {
    const late = activeLoans().filter(l => daysLeft(l.dueDate) < 0).sort((a, b) => a.borrowerName.localeCompare(b.borrowerName, "zh-Hant"));
    if(!late.length){ toast("目前沒有逾期的書"); return; }
    const txt = "【逾期未還書籍】" + ymd().replace(/-/g, "/") + "\n" +
      late.map(l => `${l.borrowerName}　${bookTitle(l.bookId, l.bookTitle)}（${l.copyId}）${md(l.dueDate)} 到期，逾期 ${-daysLeft(l.dueDate)} 天`).join("\n");
    try{ await navigator.clipboard.writeText(txt); toast("已複製 " + late.length + " 筆，可貼到 LINE"); }
    catch(e){ await askPrompt("請手動複製：", txt); }
  },
  openSettings: () => {
    sheet = { type:"form" }; showSheetWrap(); document.body.style.overflow = "hidden";
    setSheet("設定", `
      <h2 class="sec" style="margin-top:0">借書規則</h2>
      <div class="row2">
        <label class="f"><span>學生每次限借（本）</span><input type="number" id="sLimit" value="${ruleOf("student").limit}" min="1" max="20" inputmode="numeric"></label>
        <label class="f"><span>學生借期（天）</span><input type="number" id="sDays" value="${ruleOf("student").days}" min="1" max="120" inputmode="numeric"></label>
        <label class="f"><span>家長每次限借（本）</span><input type="number" id="pLimit" value="${ruleOf("parent").limit}" min="1" max="20" inputmode="numeric"></label>
        <label class="f"><span>家長借期（天）</span><input type="number" id="pDays" value="${ruleOf("parent").days}" min="1" max="120" inputmode="numeric"></label>
      </div>
      <label class="f"><span>逾期還書的停借期（一個週期）從哪天開始算</span>
        <select id="sBan"><option value="due" ${state.settings.banFrom !== "return" ? "selected" : ""}>從到期日（截止日）算起</option>
        <option value="return" ${state.settings.banFrom === "return" ? "selected" : ""}>從實際還書日算起</option></select></label>
      <button class="btn big primary" data-act="saveSettings">儲存</button>
      <h2 class="sec">ISBN 查詢小幫手</h2>
      <p style="font-size:14px;color:var(--muted);margin:0 0 8px">貼上 Google Apps Script 部署後的網址（https://script.google.com/macros/s/…/exec），掃描台灣出版的新書時就能自動帶出書名、作者、出版社。</p>
      <input type="text" id="sProxy" value="${esc(state.settings.isbnProxy || DEFAULT_ISBN_PROXY)}" placeholder="https://script.google.com/macros/s/…/exec" style="margin-bottom:8px">
      <div class="toolbar"><button class="btn primary" data-act="saveProxy">儲存網址</button>
      <input type="text" id="sProxyTest" placeholder="測試用 ISBN" inputmode="numeric" style="flex:1;min-width:140px"><button class="btn" data-act="testProxy">測試</button></div>
      <div id="proxyMsg"></div>
      <h2 class="sec">匯入書籍</h2>
      <p style="font-size:14px;color:var(--muted);margin:0 0 10px">選擇整理好的書庫匯入檔（.json）。書名相同的書會自動略過，不會重複建立。</p>
      <button class="btn primary" data-act="pickImport">選擇匯入檔</button>
      <input type="file" id="importFile" accept=".json,application/json" hidden>
      <div id="importMsg"></div>
      <h2 class="sec">分類名稱</h2>
      <div class="list">${catRows() || `<div class="empty">還沒有分類</div>`}</div>
      <h2 class="sec">資料備份</h2>
      <p style="font-size:14px;color:var(--muted);margin:0 0 10px">下載所有書籍、冊號與借閱紀錄（JSON 檔），建議每學期備份一次。</p>
      <button class="btn" data-act="exportJson">下載備份</button>
      <h2 class="sec">標籤規格</h2>
      <select id="sLabel" style="margin-bottom:8px">${Object.keys(LABEL_FORMATS).map(k => `<option value="${k}" ${labelFormat() === LABEL_FORMATS[k] ? "selected" : ""}>${LABEL_FORMATS[k].name}</option>`).join("")}</select>
      <p style="font-size:14px;color:var(--muted);margin:0 0 10px">選好後按下方「儲存標籤規格」。列印時請選「實際大小／100%」、邊界「無」，並取消「頁首和頁尾」。</p>
      <button class="btn" data-act="saveLabelFmt">儲存標籤規格</button>
      <button class="btn" data-act="resetLabels" style="margin-left:6px">全部改回未印</button>`);
  },
  doImport: async el => {
    const list = pendingImport; if(!list) return;
    el.disabled = true; el.textContent = "匯入中…";
    try{
      const total = list.reduce((s, b) => s + b.copies, 0);
      const ids = await allocCopyIds(total);
      const up = {}, now = Date.now(); let k = 0;
      list.forEach((b, i) => {
        const bookId = "N" + now.toString(36).toUpperCase() + String(i).padStart(4, "0");
        up["books/" + bookId] = { isbn:"", title:b.title, author:b.author || "", publisher:b.publisher || "", year:b.year || "",
          category:b.category || "", level:b.level || "", note:b.note || "", cover:"", createdAt:now, source:"import" };
        for(let c = 0; c < b.copies; c++) up["copies/" + ids[k++]] = { bookId, status:"in", createdAt:now, labelPrinted:false };
      });
      await db.ref(DB_ROOT).update(up);
      pendingImport = null;
      toast(`匯入完成：${list.length} 種、${total} 冊（${ids[0]}～${ids[ids.length - 1]}）`, 5000);
      closeSheet();
    }catch(e){ toast("匯入失敗：" + e.message, 5000); el.disabled = false; el.textContent = "確認匯入"; }
  },
  saveProxy: async () => {
    const u = $("#sProxy").value.trim();
    if(u && !/^https:\/\/script\.google(usercontent)?\.com\//.test(u)){ toast("網址應該是 https://script.google.com/macros/s/… 開頭"); return; }
    await db.ref(DB_ROOT + "/settings/isbnProxy").set(u); toast(u ? "已儲存查詢小幫手網址" : "已清除網址");
  },
  testProxy: async () => {
    const u = $("#sProxy").value.trim(), isbn = normalizeIsbn($("#sProxyTest").value);
    const msg = $("#proxyMsg");
    if(!u){ toast("請先貼上網址"); return; }
    if(!isbn){ toast("請輸入一本書的 ISBN（978 開頭 13 碼）"); return; }
    msg.innerHTML = `<div class="notice">查詢中…（第一次約需 5～10 秒）</div>`;
    try{
      const j = await (await fetch(u + (u.indexOf("?") >= 0 ? "&" : "?") + "isbn=" + isbn + "&debug=1")).json();
      msg.innerHTML = j.ok
        ? `<div class="notice">成功（來源：${esc(j.source)}）<br><b>${esc(j.title)}</b><br>${esc(j.author)}　${esc(j.publisher)}　${esc(j.year)}</div>`
        : `<div class="notice warn">小幫手有回應，但查不到這本書。<br><small>${esc((j.log || []).join(" ／ "))}</small></div>`;
    }catch(e){ msg.innerHTML = `<div class="notice warn">連不到小幫手：${esc(e.message)}。請確認部署時「誰可以存取」選的是「所有人」。</div>`; }
  },
  saveLabelFmt: async () => {
    await db.ref(DB_ROOT + "/settings/labelFormat").set($("#sLabel").value);
    toast("已改為 " + LABEL_FORMATS[$("#sLabel").value].name.split("（")[0]);
  },
  saveSettings: async () => {
    const num = (sel, def, max) => Math.min(max, Math.max(1, parseInt($(sel).value, 10) || def));
    await db.ref(DB_ROOT + "/settings").update({ loanDays:num("#sDays", 14, 120), studentLimit:num("#sLimit", 2, 20),
      parentDays:num("#pDays", 28, 120), parentLimit:num("#pLimit", 1, 20), banFrom:$("#sBan").value });
    toast("已儲存"); closeSheet();
  },
  exportJson: () => {
    const data = { exportedAt:new Date().toISOString(), books:state.books, copies:state.copies, loans:state.loans, settings:state.settings };
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 1)], { type:"application/json" }));
    a.download = "教室圖書備份_" + ymd() + ".json"; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  },
};

document.addEventListener("click", e => {
  const tab = e.target.closest("[data-tab]");
  if(tab){
    currentTab = tab.dataset.tab;
    document.querySelectorAll("nav.tabbar button").forEach(b => b.classList.toggle("active", b === tab));
    document.querySelectorAll(".tab-panel").forEach(p => p.classList.toggle("active", p.id === "tab-" + currentTab));
    window.scrollTo(0, 0); return;
  }
  const lc = e.target.closest("#loanChips .chip");
  if(lc){ loanFilter = lc.dataset.filter; document.querySelectorAll("#loanChips .chip").forEach(c => c.classList.toggle("active", c === lc)); renderLoans(); return; }
  const ps = e.target.closest("[data-pickscan]");
  if(ps){ $("#fScanBy").value = ps.dataset.pickscan; document.querySelectorAll("#scanByPick .chip").forEach(c => c.classList.toggle("active", c === ps)); return; }
  const pc = e.target.closest("[data-pickcat]");
  if(pc){ $("#fCat").value = pc.dataset.pickcat; document.querySelectorAll("#catPick .chip").forEach(c => c.classList.toggle("active", c === pc)); return; }
  const pt = e.target.closest("[data-ptype]");
  if(pt){ pickType = pt.dataset.ptype; document.querySelectorAll("#pickType .chip").forEach(c => c.classList.toggle("active", c === pt));
    $("#pickDue").value = addDays(ruleOf(pickType).days); renderPickResults(); return; }
  const bc = e.target.closest("[data-bcat]");
  if(bc){ bookCat = bc.dataset.bcat; bookLevel = "all"; renderBooks(); return; }
  const bl = e.target.closest("[data-blv]");
  if(bl){ bookLevel = bl.dataset.blv; renderBooks(); return; }
  const sc = e.target.closest("#stuChips .chip");
  if(sc){ stuFilter = sc.dataset.filter; document.querySelectorAll("#stuChips .chip").forEach(c => c.classList.toggle("active", c === sc)); renderStudents(); return; }
  const a = e.target.closest("[data-act]");
  if(a && actions[a.dataset.act]){
    if(!db && !["closeSheet","closeScan"].includes(a.dataset.act)){ toast("尚未連上資料庫"); return; }
    actions[a.dataset.act](a);
  }
});
$("#manualForm").addEventListener("submit", e => { e.preventDefault(); const v = $("#manualCode").value; $("#manualCode").value = ""; scanSource = "manual"; handleCode(v); });
$("#loanSearch").addEventListener("input", renderLoans);
$("#bookSearch").addEventListener("input", renderBooks);
$("#bookSort").addEventListener("change", renderBooks);
$("#stuSearchTab").addEventListener("input", renderStudents);
document.addEventListener("keydown", e => { if(e.key === "Escape"){ if(!$("#scanOverlay").hidden) closeScan(); else closeSheet(); } });

init();
renderAll();
</script>
</body>
</html>
